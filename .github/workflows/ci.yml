name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Amazon's public mirror of the official image: Docker Hub pulls kept failing on runners.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: sa
          POSTGRES_PASSWORD: sa
          POSTGRES_DB: squared_away
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sa" --health-interval 5s --health-timeout 5s --health-retries 10
    # Throwaway values for CI only. Nothing here talks to real Google or a real database.
    env:
      APP_URL: http://localhost:3100
      DATABASE_URL: postgres://sa:sa@localhost:5432/squared_away
      AUTH_SECRET: ci-only-secret-0000000000000000000000000
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: ci-dummy-client-id
      AUTH_GOOGLE_SECRET: ci-dummy-client-secret
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ADMIN_EMAIL: admin@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build
        # On failure, surface the error lines as annotations (readable without the raw log).
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log || {
            grep -iE "error|failed|⨯|cannot|unexpected" build.log | tail -25 | while IFS= read -r line; do
              echo "::error title=next build::${line}"
            done
            exit 1
          }
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
