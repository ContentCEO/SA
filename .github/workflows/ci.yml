name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The unit suite alone takes ~14 minutes on a GitHub runner (1,500+ tests, each DB test on a
    # fresh in-memory Postgres) and the whole job ~19.5; 20 started cutting off passing runs.
    timeout-minutes: 45
    # Throwaway values for CI only. Nothing here talks to real Google or a real database.
    env:
      APP_URL: http://localhost:3100
      DATABASE_URL: postgres://sa:sa@localhost:5432/squared_away
      AUTH_SECRET: ci-only-secret-0000000000000000000000000
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: ci-dummy-client-id
      AUTH_GOOGLE_SECRET: ci-dummy-client-secret
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ADMIN_EMAIL: admin@example.com
    steps:
      - uses: actions/checkout@v4
      # PostgreSQL 16 comes preinstalled on GitHub's Ubuntu runners: start it instead of pulling a
      # container image (Docker Hub, then Amazon's mirror, both hit download limits on shared runners).
      - name: Start Postgres
        run: |
          sudo systemctl start postgresql.service
          pg_isready -h localhost -p 5432 -t 30
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE sa LOGIN SUPERUSER PASSWORD 'sa';"
          sudo -u postgres createdb -O sa squared_away
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Check 30 P2: drizzle silently skips a migration stamped older than one already applied,
      # so this branch's journal must be main's journal unchanged plus new entries at the end.
      - name: Migration journal only grows
        run: |
          git fetch --no-tags --depth=1 origin main
          git show origin/main:drizzle/meta/_journal.json > "$RUNNER_TEMP/main-journal.json"
          pnpm exec tsx scripts/check-journal.ts "$RUNNER_TEMP/main-journal.json"
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build
        # On failure, surface the error lines as annotations (readable without the raw log).
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log || {
            grep -iE "error|failed|⨯|cannot|unexpected" build.log | tail -25 | while IFS= read -r line; do
              echo "::error title=next build::${line}"
            done
            exit 1
          }
      - run: pnpm exec playwright install --with-deps chromium
      # Playwright starts the e2e fakes (fake Google / Gmail / Anthropic, tsx) on 3101 next to
      # the app on 3100, in local e2e mode with neutral credentials: no new secrets needed.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
